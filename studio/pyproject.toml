[project]
name = "ssas-studio"
version = "0.2.1"
description = "SSAS Studio (the Admin App): capture people, train one face model per group, export to USB for the smart screens."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "PySide6-Essentials>=6.7",
    "openpyxl>=3.1",
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-image>=0.24", "ruff>=0.17"]

[project.gui-scripts]
ssas-studio = "ssas_studio.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # long lines: the formatter handles code, and strings (style sheet, texts) may be long
    "B008",
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"ssas_studio/ui/*" = ["N802"]  # Qt overrides are camelCase
