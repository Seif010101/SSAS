{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Admin sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>Email <input name="email" type="email" required value="{{ email or '' }}" autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <label>6-digit code from your authenticator app <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" required autocomplete="one-time-code"></label>
    <button class="primary">Sign in</button>
  </form>
</section>
{% endblock %}
